<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar admin">
        <span class="brand">💊 MedFinder</span>
        <div><a href="/">Home</a></div>
    </div>

    <div class="container" style="max-width: 480px; text-align: center;">
        <svg width="90" height="90" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 10px;">
            <circle cx="45" cy="45" r="42" fill="#f5f3ff"/>
            <circle cx="45" cy="45" r="20" fill="#7c3aed"/>
            <path d="M45 33 L50 42 L60 43 L52 50 L54 60 L45 55 L36 60 L38 50 L30 43 L40 42 Z" fill="#fde68a"/>
        </svg>
        <h1 style="text-align:left;">Admin Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div style="text-align: left;">
        <form method="POST" action="/admin/login">
            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
                </form>
        </div>
    </div>
</body>
</html>
