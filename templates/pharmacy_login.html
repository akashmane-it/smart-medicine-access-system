<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar pharmacy">
        <span class="brand">💊 MedFinder</span>
        <div><a href="/">Home</a></div>
    </div>

    <div class="container" style="max-width: 480px; text-align: center;">
        <svg width="90" height="90" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 10px;">
            <circle cx="45" cy="45" r="42" fill="#f0fdfa"/>
            <rect x="25" y="35" width="40" height="35" rx="4" fill="#0d9488"/>
            <rect x="38" y="45" width="14" height="14" fill="#ffffff"/>
            <path d="M20 38 L45 18 L70 38 Z" fill="#0f766e"/>
        </svg>
        <h1 style="text-align:left;">Pharmacy Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div style="text-align: left;">
        <form method="POST" action="/pharmacy/login">
            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
                </form>
        </div>

        <p style="margin-top:18px;">Don't have a pharmacy account? <a href="/pharmacy/register">Register here</a></p>
    </div>
</body>
</html>
