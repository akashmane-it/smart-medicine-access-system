<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar pharmacy">
        <span class="brand">💊 MedFinder</span>
        <div><a href="/">Home</a></div>
    </div>

    <div class="container" style="max-width: 480px;">
        <h1>Pharmacy Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/pharmacy/login">
            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p style="margin-top:18px;">Don't have a pharmacy account? <a href="/pharmacy/register">Register here</a></p>
    </div>
</body>
</html>
