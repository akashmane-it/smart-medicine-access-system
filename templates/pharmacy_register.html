<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar pharmacy">
        <span class="brand">💊 MedFinder</span>
        <div><a href="/">Home</a></div>
    </div>

    <div class="container" style="max-width: 560px; text-align: center;">
        <svg width="90" height="90" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 10px;">
            <circle cx="45" cy="45" r="42" fill="#f0fdfa"/>
            <rect x="25" y="35" width="40" height="35" rx="4" fill="#0d9488"/>
            <rect x="38" y="45" width="14" height="14" fill="#ffffff"/>
            <path d="M20 38 L45 18 L70 38 Z" fill="#0f766e"/>
        </svg>
        <h1 style="text-align:left;">Pharmacy Registration</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div style="text-align: left;">
        <form method="POST" action="/pharmacy/register" id="regForm">
            <label>Pharmacy Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <label>Address</label>
            <input type="text" name="address" id="address" required>
            <button type="button" onclick="findCoordinates()">📍 Find Coordinates</button>

            <p id="geoStatus" style="margin-top:10px; font-size:0.9em;"></p>

            <label>Contact Number</label>
            <input type="text" name="contact">

            <label>Latitude</label>
            <input type="number" step="any" name="latitude" id="latitude" placeholder="Auto-filled after Find Coordinates" required>

            <label>Longitude</label>
            <input type="number" step="any" name="longitude" id="longitude" placeholder="Auto-filled after Find Coordinates" required>

            <br>
            <button type="submit">Register Pharmacy</button>
                </form>
        </div>

        <p style="margin-top:18px;">Already registered? <a href="/pharmacy/login">Login here</a></p>
    </div>

    <script>
        async function findCoordinates() {
            const address = document.getElementById('address').value.trim();
            const status = document.getElementById('geoStatus');

            if (!address) {
                status.innerText = "⚠️ Please type an address first.";
                return;
            }

            status.innerText = "🔍 Looking up coordinates...";

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`
                );
                const data = await response.json();

                if (data.length > 0) {
                    document.getElementById('latitude').value = data[0].lat;
                    document.getElementById('longitude').value = data[0].lon;
                    status.innerText = `✅ Found: ${data[0].display_name}`;
                } else {
                    status.innerText = "❌ Address not found. Try a more specific address, or enter coordinates manually.";
                }
            } catch (error) {
                status.innerText = "⚠️ Lookup failed. Check your internet connection, or enter coordinates manually.";
            }
        }
    </script>
</body>
</html>
